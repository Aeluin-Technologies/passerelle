syntax = "proto3";

package aeluin.interop.v1;
option go_package = "github.com/Aeluin-Technologies/passerelle/go/interop/v1;interopv1";

import "ringil/v1/ringil.proto";

// Broad classification of strategic command directives issued by Galadril.
enum CommandType {
  // Default state, invalid or unassigned command.
  COMMAND_TYPE_UNSPECIFIED = 0;
  // Overrides the swarm or unit activity mode.
  COMMAND_TYPE_FORCE_MODE = 1;
  // Updates the global mission target coordinate.
  COMMAND_TYPE_STRATEGIC_GOAL = 2;
  // Dynamically inserts or modifies a restricted area/No-Fly Zone.
  COMMAND_TYPE_RESTRICT_ZONE = 3;
  // Triggers immediate recall of a unit or the entire swarm to base.
  COMMAND_TYPE_FORCE_RECOVERY = 4;
  // Manual telemetry request override bypassing current Zenoh priority queues.
  COMMAND_TYPE_POLL_STATUS = 5;
}

// Actionable instruction packet generated by Galadril after analytical inference.
message GaladrilCommand {
  // Unique command sequence identifier for idempotency and tracking.
  uint64 command_id = 1;
  // Microseconds since Unix Epoch when the command was generated.
  uint64 timestamp_us = 2;
  // Target identifier. Set to 0 for swarm-wide broadcast, or specific node ID.
  uint32 target_node_id = 3;
  // Categorized nature of the directive.
  CommandType command_type = 4;

  // Specific payload matching the assigned CommandType.
  oneof directive {
    // Used when command_type is COMMAND_TYPE_FORCE_MODE.
    ringil.swarm.v1.ActivityMode forced_mode = 5;
    
    // Used when command_type is COMMAND_TYPE_STRATEGIC_GOAL.
    ringil.swarm.v1.GeoPoint strategic_goal = 6;
    
    // Used when command_type is COMMAND_TYPE_RESTRICT_ZONE.
    ringil.swarm.v1.MappingUpdate hazard_zone = 7;
  }
}

// Encapsulates the evaluation framework for the Go Kubernetes Operator.
// This structure is read by the deployment controller to validate compatibility.
message ManifestConstraint {
  // Semantic version of the required interop protocol.
  string required_interop_version = 1;
  // Min required Ringil firmware hash or version.
  string min_ringil_version = 2;
  // Min required Galadril analytical model hash or version.
  string min_galadril_version = 3;
}

// High-level wrapper frame for all Brain-to-Swarm intercommunication payloads.
message InteropFrame {
  // Tracking ID for the origin system.
  uint32 source_system_id = 1;
  // Microseconds since Unix Epoch for transport layer auditing.
  uint64 timestamp_us = 2;
  
  // Priority hint for Zenoh network infrastructure routing.
  ringil.swarm.v1.PriorityLevel priority = 3;

  // The actual payload of the interop communication frame.
  oneof payload {
    // Strategic order routed from Galadril to the swarm.
    GaladrilCommand command = 4;
    // Infrastructure manifest used by Artemis for deployment validation.
    ManifestConstraint deployment_manifest = 5;
  }
}
